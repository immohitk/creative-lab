<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <meta
      name="description"
      content="A simple, accessible calculator for everyday arithmetic."
    />
    <title>Creative Lab Calculator</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./calculator.js" defer></script>
  </head>
  <body>
    <main class="calculator" aria-label="Calculator">
      <header class="calculator__header">
        <h1>Creative Lab Calculator</h1>
      </header>
      <section class="calculator__display" aria-label="Calculator display">
        <input
          id="expression"
          class="calculator__expression"
          aria-label="Editable expression"
          type="text"
          inputmode="none"
          autocomplete="off"
          spellcheck="false"
          placeholder="Enter a calculation"
        />
        <p
          id="preview"
          class="calculator__preview"
          aria-label="Live preview"
          aria-live="polite"
        ></p>
        <output
          id="display"
          class="calculator__result"
          aria-live="polite"
          aria-atomic="true"
          >0</output
        >
        <p id="error" class="calculator__error" role="status"></p>
        <button
          type="button"
          id="history-toggle"
          class="history-toggle"
          aria-label="Show calculation history"
          aria-expanded="false"
          aria-controls="history-drawer"
        >
          <span aria-hidden="true">◷</span>
        </button>
        <div class="history-drawer" id="history-drawer" aria-hidden="true">
          <div class="history-drawer__handle" aria-hidden="true"></div>
          <div class="history__header">
            <h2>History</h2>
            <button
              type="button"
              id="clear-history"
              aria-label="Clear history"
              title="Clear history"
            >
              <svg
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M3 6h18" />
                <path d="M8 6V4h8v2" />
                <path d="m19 6-1 14H6L5 6" />
                <path d="M10 10v6M14 10v6" />
              </svg>
            </button>
          </div>
          <p id="history-empty">Your recent calculations will appear here.</p>
          <ol id="history-list" class="history__list"></ol>
        </div>
      </section>
      <section class="calculator__keypad" aria-label="Calculator keys">
        <button type="button" data-action="clear" aria-label="All clear">
          AC
        </button>
        <button
          type="button"
          data-action="backspace"
          aria-label="Backspace"
          title="Backspace"
        >
          <svg
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M9 4H21V20H9L2 12L9 4Z" />
            <path d="m13 9 5 6m0-6-5 6" />
          </svg>
        </button>
        <button type="button" data-operator="/" aria-label="Divide">÷</button>
        <button type="button" data-operator="*" aria-label="Multiply">×</button>
        <button type="button" data-digit="7">7</button
        ><button type="button" data-digit="8">8</button>
        <button type="button" data-digit="9">9</button
        ><button type="button" data-operator="-" aria-label="Subtract">
          −
        </button>
        <button type="button" data-digit="4">4</button
        ><button type="button" data-digit="5">5</button>
        <button type="button" data-digit="6">6</button
        ><button type="button" data-operator="+" aria-label="Add">+</button>
        <button type="button" data-digit="1">1</button
        ><button type="button" data-digit="2">2</button>
        <button type="button" data-digit="3">3</button
        ><button type="button" data-action="equals" class="key--equals">
          =
        </button>
        <button type="button" data-action="sign" aria-label="Change sign">
          +/−
        </button>
        <button type="button" data-digit="0">0</button
        ><button type="button" data-action="decimal">.</button>
      </section>
    </main>
  </body>
</html>
